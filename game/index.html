<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gobble Dash — The Great Turkey Escape</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #2b1a12;
    font-family: "Trebuchet MS", Verdana, sans-serif;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 30%, #4a2c1a 0%, #2b1a12 75%);
  }
  #game {
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    display: block;
    touch-action: none;
    cursor: pointer;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
  }
  #sr-status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="960" height="540"
    aria-label="Gobble Dash: help Tom the turkey escape Farmer Bram, jump fences, dodge ovens and carving knives, and reach the forest"></canvas>
</div>
<p id="sr-status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
